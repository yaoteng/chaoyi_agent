<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>chaoyi_agent social preview</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;}
  body{width:1280px;height:640px;background:#0a0a12;overflow:hidden;}
  #card{position:relative;width:1280px;height:640px;padding:80px 90px;
    background:radial-gradient(900px 600px at 80% -20%,#1b1430 0%,#0a0a12 60%);
    color:#eef0ff;display:flex;flex-direction:column;justify-content:center;}
  #card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#262640 1px,transparent 1px),linear-gradient(90deg,#262640 1px,transparent 1px);background-size:60px 60px;opacity:.10;}
  .glow{position:absolute;width:600px;height:600px;left:-160px;top:-160px;border-radius:50%;background:radial-gradient(circle,rgba(124,92,255,.28),transparent 60%);}
  .brand{position:relative;font-size:34px;font-weight:700;color:#ff4d6d;letter-spacing:.12em;margin-bottom:22px;}
  h1{position:relative;font-size:78px;font-weight:900;line-height:1.12;max-width:980px;}
  h1 span{background:linear-gradient(90deg,#fff,#ff8fa3);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap;}
  .sub{position:relative;font-size:32px;color:#9aa0c0;margin-top:28px;max-width:960px;}
  .skills{position:relative;display:flex;gap:14px;margin-top:36px;flex-wrap:wrap;}
  .chip{background:#12121f;border:1px solid #262640;border-radius:999px;padding:12px 22px;font-size:22px;color:#d6dbff;}
  .url{position:absolute;right:90px;bottom:62px;font-family:"SF Mono",Consolas,monospace;font-size:24px;color:#7c5cff;}
  .badge{position:absolute;right:90px;top:62px;background:#12121f;border:1px solid #262640;border-radius:10px;padding:10px 20px;font-size:22px;color:#9aa0c0;}
</style>
</head>
<body>
<div id="card">
  <div class="glow"></div>
  <div class="badge">MIT · Skills 1.0 · MCP 0.4</div>
  <div class="brand">潮驿 Agent / Chaoyi Agent</div>
  <h1>5 个开源 Skill，<br>让直播社区月运营 <span>40h → 6h</span></h1>
  <div class="sub">主播入驻 / 直播策划 / 直播间互动 / 社区风控 / 观众增长</div>
  <div class="skills">
    <span class="chip">streamer-onboarding</span>
    <span class="chip">live-show-plan</span>
    <span class="chip">live-room-ops</span>
    <span class="chip">community-moderation</span>
    <span class="chip">audience-growth</span>
  </div>
  <div class="url">github.com/yaoteng/chaoyi_agent</div>
</div>
</body>
</html>
